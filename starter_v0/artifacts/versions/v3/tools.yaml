# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Tạm dừng để hỏi người dùng khi thiếu thông tin bắt buộc hoặc cần xác nhận hành động ghi. Dùng text khi thiếu handle/URL; dùng yes_no trước send/post/publish. Không dùng nếu tên người đã map chắc chắn sang handle."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây CỦA một tài khoản cụ thể. Dùng cho yêu cầu theo tác giả/handle; không dùng để tìm bài theo chủ đề. screenname không gồm ký tự @."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Handle tài khoản không có @; ví dụ sama, elonmusk, karpathy"}
        limit: {type: integer, default: 5, description: "Số bài cần lấy; giữ đúng số user yêu cầu"}
      required: [screenname]

  - name: social_search
    description: "Tìm bài đăng mạng xã hội THEO từ khóa/chủ đề, không theo timeline của một tác giả. Dùng Top khi user yêu cầu phổ biến/top; mặc định Latest."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Chủ đề hoặc từ khóa cần tìm"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Latest cho mới nhất; Top cho phổ biến/top"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tìm thông tin hoặc tin tức trên web. Dùng topic=news cho tin tức; timeframe=day cho hôm nay và week cho tuần này. Nếu user đưa URL cụ thể thì dùng fetch thay vì lookup."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Đọc nội dung từ một URL cụ thể do user cung cấp. Không tự đoán URL; nếu thiếu URL thì dùng clarify."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Định dạng các item đã thu thập thành digest. Chỉ dùng khi đã có items; không dùng để tìm kiếm hoặc đọc nguồn."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Hành động có side effect: gửi nội dung ra Telegram. Chỉ dùng sau khi user đã xác nhận rõ; nếu chưa xác nhận phải dùng clarify(response_type=yes_no)."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]
